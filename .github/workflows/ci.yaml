name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test -race ./...

      - name: Go build
        run: CGO_ENABLED=0 go build -trimpath ./cmd/diffkit

  cross-compile:
    name: Cross-Compile
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: check
    strategy:
      matrix:
        target:
          - linux/amd64
          - linux/arm64
          - darwin/amd64
          - darwin/arm64
          - windows/amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.target == 'linux/amd64' && 'linux' || matrix.target == 'linux/arm64' && 'linux' || matrix.target == 'darwin/amd64' && 'darwin' || matrix.target == 'darwin/arm64' && 'darwin' || 'windows' }}
          GOARCH: ${{ matrix.target == 'linux/amd64' && 'amd64' || matrix.target == 'linux/arm64' && 'arm64' || matrix.target == 'darwin/amd64' && 'amd64' || matrix.target == 'darwin/arm64' && 'arm64' || 'amd64' }}
          CGO_ENABLED: 0
        run: |
          go build -trimpath -ldflags "-s -w" -o diffkit-${{ matrix.target }} ./cmd/diffkit
          tar czf diffkit-${{ matrix.target }}.tar.gz diffkit-${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: diffkit-${{ matrix.target }}
          path: diffkit-${{ matrix.target }}.tar.gz
