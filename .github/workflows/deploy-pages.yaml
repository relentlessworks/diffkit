name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy docs to gh-pages branch
        run: |
          git config user.name "relentlessworks[bot]"
          git config user.email "noreply@relentlessworks.com"

          # Save docs to temp
          cp -r docs /tmp/docs

          # Check if gh-pages branch exists
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
          fi

          # Clean working tree
          git rm -rf . 2>/dev/null || true

          # Copy docs content
          cp -r /tmp/docs/* .

          # Commit and push
          git add -A
          git commit -m "Deploy docs from ${{ github.sha }}" || echo "No changes to commit"
          git push origin gh-pages --force
